# Note: on RHEL8, the powertools repo must be enabled to get some of the devel packages.
---
system:
  - !OScmp ">=,10,openblas-devel,atlas-devel"
  - blas-devel
  - blas64
  - lapack-devel
  - lapack64
  - libffi-devel
  - zlib-devel
  - openssl-devel
  - tcl-devel
  - tk-devel
  - bzip2-devel
  - ncurses-devel
  - readline-devel
  - sqlite-devel
  - libyaml
  - xz-devel
  - cmake
  - libjpeg-turbo-devel
  - openjpeg2-devel
  - libtiff-devel
  - lcms2-devel
  - libwebp-devel
bootstrap:
build:
manifest:
  - "{{bootstrap}}"
  - "{{build}}"
parallel:
  sets: 3
  pkgs: 4
sets:
  - "217"
  - "380"
  - "310"
  - "314"
